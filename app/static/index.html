<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt2Diagram — AI Technical Diagram Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --code-bg: #0b1120;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.85);
    }
    header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.3px; }
    header span.badge {
      background: rgba(59, 130, 246, 0.18);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 16px;
      padding: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    label { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
    select, textarea, button {
      width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--code-bg);
      color: var(--text);
      padding: 10px;
      font-size: 0.9rem;
    }
    textarea {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      resize: vertical;
      min-height: 150px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.primary:hover { background: var(--accent-hover); }
    .preview-pane {
      background: #ffffff;
      border-radius: 8px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      min-height: 360px;
      padding: 16px;
    }
    .preview-pane img { max-width: 100%; height: auto; }
    .dsl-box { min-height: 150px; font-size: 0.82rem; }
  </style>
</head>
<body>
  <header>
    <h1>Prompt2Diagram &mdash; AI System Design &amp; Codebase Visualizer</h1>
    <span class="badge">FastAPI + OpenAI + PlantUML + AST Engine</span>
  </header>

  <main>
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('prompt')" id="tab-prompt">Prompt &rarr; Diagram</button>
        <button class="tab-btn" onclick="switchMode('code')" id="tab-code">Codebase &rarr; Diagram</button>
      </div>

      <div id="mode-prompt">
        <label>Diagram Type</label>
        <select id="diagram-type" style="margin-top:4px; margin-bottom:10px;">
          <option value="sequence">Sequence Diagram</option>
          <option value="flowchart">Flowchart / Activity Diagram</option>
          <option value="architecture">High-Level Architecture (HLD)</option>
          <option value="class">Low-Level Class Diagram (LLD)</option>
          <option value="er">Entity-Relationship (ER) Diagram</option>
        </select>

        <label>Natural Language System Prompt</label>
        <textarea id="prompt-input" style="margin-top:4px;">User requests Seat Map API in airline check-in microservice; API checks Redis L1 cache and Aerospike L2 cache, queries primary database on cache miss, and publishes real-time seat-blocking event to Apache Kafka.</textarea>
        <button class="primary" style="margin-top:10px;" onclick="generateFromPrompt()">Generate Diagram</button>
      </div>

      <div id="mode-code" style="display:none;">
        <label>Source Language</label>
        <select id="code-lang" style="margin-top:4px; margin-bottom:10px;">
          <option value="python">Python (AST Parser)</option>
          <option value="java">Java / Spring Boot</option>
          <option value="go">Go (Golang)</option>
        </select>

        <label>Paste Source Code Snippet</label>
        <textarea id="code-input" style="margin-top:4px;">class SearchService:
    def __init__(self, cache_client, solr_client):
        self.cache = cache_client
        self.solr = solr_client

    def query_products(self, keyword: str):
        cached = self.cache.get_cached_results(keyword)
        if cached:
            return cached
        results = self.solr.execute_ boosted_search(keyword)
        self.cache.store_results(keyword, results)
        return results</textarea>
        <button class="primary" style="margin-top:10px;" onclick="generateFromCode()">Analyze Code &amp; Render</button>
      </div>

      <label>Generated PlantUML DSL (Editable)</label>
      <textarea id="puml-output" class="dsl-box"></textarea>
      <button onclick="renderEditedDSL()">Re-Render Edited PlantUML</button>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label id="status-label">Live Diagram Preview (SVG)</label>
        <a id="open-svg-link" href="#" target="_blank" style="color:#60a5fa; font-size:0.82rem;">Open Full SVG &nearr;</a>
      </div>
      <div class="preview-pane" id="preview-container">
        <p style="color:#64748b;">Click "Generate Diagram" to render real-time system architecture.</p>
      </div>
    </div>
  </main>

  <script>
    function switchMode(mode) {
      document.getElementById('mode-prompt').style.display = mode === 'prompt' ? 'block' : 'none';
      document.getElementById('mode-code').style.display = mode === 'code' ? 'block' : 'none';
      document.getElementById('tab-prompt').classList.toggle('active', mode === 'prompt');
      document.getElementById('tab-code').classList.toggle('active', mode === 'code');
    }

    function updatePreview(data) {
      document.getElementById('puml-output').value = data.plantuml_code;
      document.getElementById('status-label').textContent = `Rendered via ${data.generation_mode}`;
      document.getElementById('open-svg-link').href = data.svg_url;
      document.getElementById('preview-container').innerHTML = `<img src="${data.svg_url}" alt="Rendered PlantUML Diagram" />`;
    }

    async function generateFromPrompt() {
      const prompt = document.getElementById('prompt-input').value;
      const diagram_type = document.getElementById('diagram-type').value;
      const res = await fetch('/api/v1/diagrams/prompt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, diagram_type })
      });
      const data = await res.json();
      updatePreview(data);
    }

    async function generateFromCode() {
      const source_code = document.getElementById('code-input').value;
      const language = document.getElementById('code-lang').value;
      const res = await fetch('/api/v1/diagrams/analyze-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source_code, language, diagram_type: 'architecture' })
      });
      const data = await res.json();
      updatePreview(data);
    }

    async function renderEditedDSL() {
      const plantuml_code = document.getElementById('puml-output').value;
      const res = await fetch('/api/v1/diagrams/render', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plantuml_code })
      });
      const data = await res.json();
      updatePreview(data);
    }
  </script>
</body>
</html>
